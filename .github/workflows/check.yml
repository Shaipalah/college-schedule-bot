name: Check RGKRIPT Schedule

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run schedule monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated schedule_state.json
        run: |
          if ! git diff --quiet schedule_state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schedule_state.json
            git commit -m "chore: update schedule_state.json"
            git push
          else
            echo "No changes in schedule_state.json"
          fi
